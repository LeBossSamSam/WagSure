<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WagSure - Shop</title>

    <link rel="stylesheet" href="index.css">

    <style>

        .shop {
            text-align: center;
            padding: 20px;
        }

        .product {
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
            border: 2px solid #123b5d;
            border-radius: 15px;
            background-color: #f5f5f5;
        }

        .product-image {
            width: 100%;
            max-width: 350px;
            height: auto;
            border-radius: 10px;
            margin: 10px auto 20px;
            display: block;

            /* AJOUT POUR LE SWIPE */
            user-select: none;
            -webkit-user-drag: none;
        }

        .product h2 {
            color: #123b5d;
        }

        .price {
            color: #18815b;
            font-size: 24px;
            font-weight: bold;
        }

        .quantity {
            margin: 15px;
        }

        .quantity input {
            width: 60px;
            padding: 10px;
            text-align: center;
            font-size: 16px;
        }

        .product button,
        .order-button {

            background-color: #123b5d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;

        }

        .product button:hover,
        .order-button:hover {
            background-color: #18815b;
        }

        .cart {

            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            border: 2px solid #18815b;
            border-radius: 15px;
            background-color: #f5f5f5;

        }

        .cart h2 {
            color: #123b5d;
        }


        /* =====================================
           AJOUT : ZONE DU SWIPE
           ===================================== */

        .product-image-container {
            touch-action: pan-y;
        }

    </style>

</head>


<body>


    <section class="shop">


        <h1>WagSure Shop</h1>


        <div class="product">


            <!--
                AJOUT : on met simplement
                l'image dans une zone permettant
                de détecter le swipe.
            -->

            <div
                class="product-image-container"
                id="productImageContainer">


                <!--
                    TON IMAGE ACTUELLE
                    image.png = AVANT
                -->

                <img
                    id="productImage"
                    class="product-image"
                    src="image.png"
                    alt="WagSure T-Shirt">


            </div>


            <!--
                LE RESTE DE TON SHOP
                RESTE ICI COMME AVANT
            -->


            <h2>
                WagSure T-Shirt
            </h2>


            <p>
                Official WagSure T-Shirt.
            </p>


            <p class="price">
                €19.99
            </p>


            <div class="quantity">

                <label for="quantity">
                    Quantity:
                </label>

                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1">

            </div>


            <button onclick="addToCart()">
                Add to cart
            </button>


        </div>


        <div class="cart">


            <h2>
                Your Cart
            </h2>


            <p id="cartText">
                Your cart is empty.
            </p>


            <p id="total">
                Total: €0.00
            </p>


            <button
                class="order-button"
                onclick="order()">

                Order

            </button>


        </div>


    </section>


    <script>


        /* =====================================
           TON CODE EXISTANT
           ===================================== */

        let cartQuantity = 0;

        const price = 19.99;


        function addToCart() {

            const quantityInput =
                document.getElementById("quantity");

            const quantity =
                parseInt(quantityInput.value);


            if (
                quantity < 1 ||
                isNaN(quantity)
            ) {

                alert(
                    "Please enter a valid quantity."
                );

                return;
            }


            cartQuantity += quantity;

            updateCart();

        }


        function updateCart() {

            const cartText =
                document.getElementById("cartText");

            const total =
                document.getElementById("total");


            if (cartQuantity === 0) {

                cartText.innerText =
                    "Your cart is empty.";

                total.innerText =
                    "Total: €0.00";

                return;
            }


            cartText.innerText =
                "WagSure T-Shirt × " +
                cartQuantity;


            total.innerText =
                "Total: €" +
                (cartQuantity * price).toFixed(2);

        }


        function order() {

            if (cartQuantity === 0) {

                alert(
                    "Your cart is empty."
                );

                return;
            }


            alert(
                "Thank you for your order! " +
                "You ordered " +
                cartQuantity +
                " WagSure T-Shirt(s)."
            );

        }


        /* =====================================
           AJOUT UNIQUEMENT POUR LE SWIPE
           ===================================== */


        const productImage =
            document.getElementById(
                "productImage"
            );


        const productImageContainer =
            document.getElementById(
                "productImageContainer"
            );


        let startX = 0;


        let endX = 0;


        /* Début du doigt sur l'image */

        productImageContainer.addEventListener(
            "touchstart",
            function(event) {

                startX =
                    event.changedTouches[0].screenX;

            },
            { passive: true }
        );


        /* Fin du doigt sur l'image */

        productImageContainer.addEventListener(
            "touchend",
            function(event) {

                endX =
                    event.changedTouches[0].screenX;


                const difference =
                    startX - endX;


                /*
                    DROITE → GAUCHE
                    = arrière du T-shirt
                */

                if (difference > 50) {

                    productImage.src =
                        "arriere-t-shirt.png";

                }


                /*
                    GAUCHE → DROITE
                    = avant du T-shirt
                */

                else if (difference < -50) {

                    productImage.src =
                        "image.png";

                }

            },
            { passive: true }
        );


    </script>


</body>

</html>
