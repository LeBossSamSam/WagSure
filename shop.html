<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WagSure - Shop</title>

    <link rel="stylesheet" href="index.css">

    <style>

        .shop {
            text-align: center;
            padding: 20px;
        }

        .product {
            max-width: 400px;
            margin: 30px auto;
            padding: 25px;
            border: 2px solid #123b5d;
            border-radius: 15px;
            background-color: #f5f5f5;
        }

        /* IMAGE DU T-SHIRT */

        .product-gallery {
            position: relative;
            width: 100%;
            max-width: 350px;
            margin: 10px auto 20px;
            overflow: hidden;
            border-radius: 10px;
            touch-action: pan-y;
        }

        .product-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* BOUTONS POUR CHANGER DE PHOTO */

        .gallery-button {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            width: 40px;
            height: 40px;

            border: none;
            border-radius: 50%;

            background-color: rgba(18, 59, 93, 0.85);
            color: white;

            font-size: 25px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 5;
        }

        .gallery-button:hover {
            background-color: #18815b;
        }

        .gallery-left {
            left: 10px;
        }

        .gallery-right {
            right: 10px;
        }

        .product h2 {
            color: #123b5d;
        }

        .price {
            color: #18815b;
            font-size: 24px;
            font-weight: bold;
        }

        .quantity {
            margin: 15px;
        }

        .quantity input {
            width: 60px;
            padding: 10px;
            text-align: center;
            font-size: 16px;
        }

        .product button,
        .order-button {
            background-color: #123b5d;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .product button:hover,
        .order-button:hover {
            background-color: #18815b;
        }

        .cart {
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            border: 2px solid #18815b;
            border-radius: 15px;
            background-color: #f5f5f5;
        }

        .cart h2 {
            color: #123b5d;
        }

    </style>

</head>


<body>

    <section class="shop">

        <h1>WagSure Shop</h1>


        <!-- PRODUIT -->

        <div class="product">


            <!-- GALERIE DU T-SHIRT -->

            <div class="product-gallery"
                 id="productGallery">


                <!-- BOUTON GAUCHE -->

                <button
                    class="gallery-button gallery-left"
                    onclick="previousImage()">

                    ‹

                </button>


                <!-- IMAGE -->

                <img
                    id="productImage"
                    class="product-image"
                    src="image.png"
                    alt="WagSure T-Shirt">


                <!-- BOUTON DROITE -->

                <button
                    class="gallery-button gallery-right"
                    onclick="nextImage()">

                    ›

                </button>

            </div>


            <!-- NOM DU PRODUIT -->

            <h2>
                WagSure T-Shirt
            </h2>


            <!-- DESCRIPTION -->

            <p>
                Official WagSure T-Shirt.
            </p>


            <!-- PRIX -->

            <p class="price">
                €19.99
            </p>


            <!-- QUANTITÉ -->

            <div class="quantity">

                <label for="quantity">
                    Quantity:
                </label>

                <input
                    type="number"
                    id="quantity"
                    value="1"
                    min="1">

            </div>


            <!-- AJOUTER AU PANIER -->

            <button onclick="addToCart()">

                Add to cart

            </button>

        </div>


        <!-- PANIER -->

        <div class="cart">

            <h2>
                Your Cart
            </h2>


            <p id="cartText">
                Your cart is empty.
            </p>


            <p id="total">
                Total: €0.00
            </p>


            <button
                class="order-button"
                onclick="order()">

                Order

            </button>

        </div>

    </section>


    <script>


        /* =========================================
           PHOTOS DU T-SHIRT
           ========================================= */

        const images = [

            "image.png",

            "arriere-t-shirt.png"

        ];


        let currentImage = 0;


        const productImage =
            document.getElementById("productImage");


        /* =========================================
           AFFICHER UNE IMAGE
           ========================================= */

        function showImage(index) {

            currentImage = index;

            productImage.src =
                images[currentImage];

        }


        /* =========================================
           IMAGE SUIVANTE
           ========================================= */

        function nextImage() {

            currentImage++;

            if (currentImage >= images.length) {

                currentImage = 0;

            }

            showImage(currentImage);

        }


        /* =========================================
           IMAGE PRÉCÉDENTE
           ========================================= */

        function previousImage() {

            currentImage--;

            if (currentImage < 0) {

                currentImage =
                    images.length - 1;

            }

            showImage(currentImage);

        }


        /* =========================================
           SWIPE SUR TÉLÉPHONE
           ========================================= */

        const gallery =
            document.getElementById("productGallery");


        let touchStartX = 0;

        let touchEndX = 0;


        gallery.addEventListener(
            "touchstart",
            function(event) {

                touchStartX =
                    event.changedTouches[0].screenX;

            },
            { passive: true }
        );


        gallery.addEventListener(
            "touchend",
            function(event) {

                touchEndX =
                    event.changedTouches[0].screenX;

                handleSwipe();

            },
            { passive: true }
        );


        function handleSwipe() {

            const swipeDistance =
                touchStartX - touchEndX;


            /* DROITE → GAUCHE */

            if (swipeDistance > 50) {

                nextImage();

            }


            /* GAUCHE → DROITE */

            else if (swipeDistance < -50) {

                previousImage();

            }

        }


        /* =========================================
           PANIER
           ========================================= */

        let cartQuantity = 0;

        const price = 19.99;


        function addToCart() {

            const quantityInput =
                document.getElementById("quantity");


            const quantity =
                parseInt(quantityInput.value);


            if (
                quantity < 1 ||
                isNaN(quantity)
            ) {

                alert(
                    "Please enter a valid quantity."
                );

                return;

            }


            cartQuantity += quantity;

            updateCart();

        }


        /* =========================================
           METTRE À JOUR LE PANIER
           ========================================= */

        function updateCart() {

            const cartText =
                document.getElementById("cartText");


            const total =
                document.getElementById("total");


            if (cartQuantity === 0) {

                cartText.innerText =
                    "Your cart is empty.";

                total.innerText =
                    "Total: €0.00";

                return;

            }


            cartText.innerText =
                "WagSure T-Shirt × " +
                cartQuantity;


            total.innerText =
                "Total: €" +
                (cartQuantity * price)
                    .toFixed(2);

        }


        /* =========================================
           COMMANDER
           ========================================= */

        function order() {

            if (cartQuantity === 0) {

                alert(
                    "Your cart is empty."
                );

                return;

            }


            alert(
                "Thank you for your order! " +
                "You ordered " +
                cartQuantity +
                " WagSure T-Shirt(s)."
            );

        }

    </script>

</body>

</html>
